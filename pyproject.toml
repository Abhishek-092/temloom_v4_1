[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temloom"
version = "4.1.0"
description = "TEMLOOM v4.1 — Air-Gapped Predictive Network Reliability, SRLG RCA & 2PC Verification Platform"
readme = "README.md"
